apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.gemforegroundservice'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// useDefaultAndroidSdkVersions() opens its own `android {}` block internally
// and sets compileSdkVersion/minSdkVersion/targetSdkVersion from the root
// project's ext values (or sane defaults) - it must be called instead of
// referencing getExpoDefaultMinSdkVersion()/getExpoDefaultTargetSdkVersion(),
// which don't exist on this expo-modules-core version.
useDefaultAndroidSdkVersions()

android {
  namespace "expo.modules.gemforegroundservice"
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
}
